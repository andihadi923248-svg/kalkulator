<body id="content">

    <div class="kalkulator" id="kalkulator">

        <div class="header">
            <span>CALCULATOR</span>
            <h1>Simple Calculator</h1>
            <p>Fast & Easy Calculation</p>
        </div>

        <label>Angka Pertama</label>
        <input type="number" id="angka_pertama" placeholder="Masukkan angka">

        <label>Angka Kedua</label>
        <input type="number" id="angka_kedua" placeholder="Masukkan angka">

        <div id="hasil">0</div>

        <div class="tombol">
            <button onclick="tambah()">+</button>
            <button onclick="kurang()">−</button>
            <button onclick="kali()">×</button>
            <button onclick="bagi()">÷</button>
            <button onclick="modulus()">%</button>
        </div>

        <button class="reset" onclick="resetKalkulator()">RESET</button>

        <div class="mode">
            <button onclick="darkMode()">🌙 Dark</button>
            <button onclick="lightMode()">☀ Light</button>
            
        </div>
